apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrations
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: backend-migrations
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: migrations
          image: ghcr.io/marpot/corporation_simulation_project:latest
          imagePullPolicy: IfNotPresent
          command:
            - dockerize
            - -wait
            - tcp://db:5432
            - -timeout
            - 660s
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
